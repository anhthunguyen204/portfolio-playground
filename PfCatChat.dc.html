<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./theme.js"></script><script src="./content.js"></script></helmet>
<div ref="{{ rootRef }}" style="position:relative;display:flex;font-family:var(--pf-sans)">
  <button type="button" ref="{{ btnRef }}" onClick="{{ toggle }}" aria-label="{{ btnLabel }}" title="{{ btnLabel }}" aria-expanded="{{ open }}" aria-haspopup="dialog" aria-controls="pf-cat-chat" style="flex:none;width:{{ px }};height:{{ px }};display:flex;align-items:center;justify-content:center;padding:0;background:var(--pf-surface);color:var(--pf-fg);border:none;border-radius:999px;cursor:pointer;transition:background-color 180ms,transform 140ms cubic-bezier(.2,.7,.2,1)" style-hover="background:var(--pf-line)" style-active="transform:scale(0.94);background:var(--pf-line)" style-focus="outline:2px solid var(--pf-focus);outline-offset:2px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11V4.6l4 3a8.6 8.6 0 0 1 6 0l4-3V11c0 4.4-3.1 8-7 8s-7-3.6-7-8z"></path><path d="M11.3 14.2h1.4L12 15z"></path><path d="M1.8 13.3l3.4.5M2.2 16.4l3.1-1M22.2 13.3l-3.4.5M21.8 16.4l-3.1-1"></path><circle cx="9.4" cy="11.6" r="0.6" fill="currentColor"></circle><circle cx="14.6" cy="11.6" r="0.6" fill="currentColor"></circle></svg>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div id="pf-cat-chat" role="dialog" aria-label="A little cat chat" style="position:absolute;top:calc(100% + 12px);right:{{ popRight }};width:{{ popW }};max-height:{{ popMaxH }};display:flex;flex-direction:column;background:var(--pf-card);color:var(--pf-fg);border-radius:20px;box-shadow:0 0 0 1px var(--pf-line),var(--pf-card-shadow-hover);overflow:hidden;z-index:60;text-align:left">
      <div style="flex:none;display:flex;align-items:center;gap:12px;padding:14px 12px 12px 16px">
        <span aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--pf-accent-tint);color:var(--pf-accent)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V4.6l4 3a8.6 8.6 0 0 1 6 0l4-3V11c0 4.4-3.1 8-7 8s-7-3.6-7-8z"></path><path d="M11.3 14.2h1.4L12 15z"></path><path d="M1.8 13.3l3.4.5M2.2 16.4l3.1-1M22.2 13.3l-3.4.5M21.8 16.4l-3.1-1"></path><circle cx="9.4" cy="11.6" r="0.6" fill="currentColor"></circle><circle cx="14.6" cy="11.6" r="0.6" fill="currentColor"></circle></svg></span>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
          <span style="font-size:15px;font-weight:600;letter-spacing:-0.01em">A little cat chat</span>
          <span style="display:flex;align-items:center;gap:6px;font-family:var(--pf-mono);font-size:11px;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-muted)"><span style="width:6px;height:6px;border-radius:50%;background:{{ statusDot }}"></span>{{ statusText }}</span>
        </div>
        <button type="button" onClick="{{ closeBtn }}" aria-label="Close cat chat" style="flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;background:transparent;color:var(--pf-muted);border:none;border-radius:999px;cursor:pointer;transition:background-color 160ms,color 160ms" style-hover="background:var(--pf-surface);color:var(--pf-fg)" style-active="transform:scale(0.94)" style-focus="outline:2px solid var(--pf-focus);outline-offset:1px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
      <div ref="{{ listRef }}" aria-live="polite" style="flex:1;min-height:120px;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px">
        <sc-for list="{{ msgs }}" as="m" hint-placeholder-count="2">
          <sc-if value="{{ m.isCat }}" hint-placeholder-val="{{ true }}">
            <div style="align-self:flex-start;max-width:88%;display:flex;flex-direction:column;gap:8px;background:var(--pf-surface);color:var(--pf-fg);border-radius:16px 16px 16px 6px;padding:10px 14px 12px;font-size:14px;line-height:1.5;overflow-wrap:anywhere">
              <sc-for list="{{ m.paras }}" as="pa" hint-placeholder-count="1"><p style="margin:0;white-space:pre-wrap;text-wrap:pretty">{{ pa }}</p></sc-for>
              <sc-if value="{{ m.hasTail }}" hint-placeholder-val="{{ false }}"><p style="margin:0;text-wrap:pretty">{{ m.tailBefore }}<a href="{{ m.tailHref }}" style="color:var(--pf-accent);font-weight:500;text-decoration:underline;text-underline-offset:2px" style-focus="outline:2px solid var(--pf-focus);outline-offset:2px">{{ m.tailLink }}</a>{{ m.tailAfter }}</p></sc-if>
              <sc-if value="{{ m.hasLinks }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;flex-wrap:wrap;gap:6px;padding-top:2px">
                  <sc-for list="{{ m.links }}" as="lk" hint-placeholder-count="3"><a href="{{ lk.href }}" target="{{ lk.target }}" rel="noopener" onClick="{{ lk.onClick }}" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--pf-card);color:var(--pf-fg);font-size:12.5px;font-weight:500;line-height:1.3;text-decoration:none;transition:color 160ms,background-color 160ms" style-hover="color:var(--pf-accent)" style-focus="outline:2px solid var(--pf-focus);outline-offset:2px">{{ lk.label }}<span aria-hidden="true" style="color:var(--pf-subtle)">{{ lk.arrow }}</span></a></sc-for>
                </div>
              </sc-if>
              <sc-if value="{{ m.hasTools }}" hint-placeholder-val="{{ false }}">
                <ul aria-label="AI toolkit" style="list-style:none;margin:0;padding:2px 0 0;display:flex;flex-wrap:wrap;gap:6px">
                  <sc-for list="{{ m.tools }}" as="tl" hint-placeholder-count="4"><li style="display:flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--pf-card);font-size:12.5px;font-weight:500;line-height:1.3"><span aria-hidden="true" style="flex:none;width:14px;height:14px;display:flex;align-items:center;justify-content:center">{{ tl.logo }}</span>{{ tl.name }}</li></sc-for>
                </ul>
              </sc-if>
            </div>
          </sc-if>
          <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
            <div style="align-self:flex-end;max-width:86%;background:var(--pf-fg);color:var(--pf-bg);border-radius:16px 16px 6px 16px;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere">{{ m.text }}</div>
          </sc-if>
          <sc-if value="{{ m.isNote }}" hint-placeholder-val="{{ false }}">
            <div role="status" style="align-self:stretch;background:var(--pf-accent-tint);color:var(--pf-body);border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.5;overflow-wrap:anywhere">{{ m.text }}</div>
          </sc-if>
        </sc-for>
        <sc-if value="{{ sending }}" hint-placeholder-val="{{ false }}">
          <div style="align-self:flex-start;background:var(--pf-surface);color:var(--pf-muted);border-radius:16px 16px 16px 6px;padding:10px 14px;font-size:14px;line-height:1.5">{{ typingText }}</div>
        </sc-if>
        <sc-if value="{{ showSuggest }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;flex-direction:column;gap:8px;padding-top:2px">
            <span style="font-family:var(--pf-mono);font-size:11px;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-subtle)">{{ suggestLabel }}</span>
            <div role="group" aria-label="Suggested questions" style="display:flex;flex-wrap:wrap;gap:6px">
              <sc-for list="{{ suggestions }}" as="sq" hint-placeholder-count="6"><button type="button" onClick="{{ sq.ask }}" style="padding:6px 11px;border:none;border-radius:999px;background:var(--pf-accent-tint);color:var(--pf-fg);font-family:var(--pf-sans);font-size:12.5px;font-weight:500;line-height:1.3;text-align:left;cursor:pointer;transition:background-color 160ms,color 160ms,transform 120ms" style-hover="color:var(--pf-accent)" style-active="transform:scale(0.97)" style-focus="outline:2px solid var(--pf-focus);outline-offset:2px">{{ sq.q }}</button></sc-for>
            </div>
          </div>
        </sc-if>
      </div>
      <form onSubmit="{{ onSubmit }}" style="flex:none;margin:0;padding:0 12px 12px">
        <div style="display:flex;align-items:flex-end;gap:8px;background:var(--pf-surface);border-radius:16px;padding:6px 6px 6px 14px">
          <textarea ref="{{ inputRef }}" rows="1" value="{{ draft }}" onInput="{{ onInput }}" onKeyDown="{{ onKeyDown }}" placeholder="Ask me anything..." aria-label="Message the cat" style="flex:1;min-width:0;min-height:24px;max-height:96px;margin:0;padding:6px 0;border:none;background:transparent;color:var(--pf-fg);font-family:var(--pf-sans);font-size:14px;line-height:1.45;resize:none;outline:none;cursor:text"></textarea>
          <button type="submit" aria-label="Send message" aria-disabled="{{ cantSend }}" style="flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;padding:0;background:var(--pf-accent);color:var(--pf-on-accent);border:none;border-radius:999px;cursor:pointer;opacity:{{ sendOpacity }};transition:background-color 160ms,transform 140ms,opacity 160ms" style-hover="background:var(--pf-accent-hover)" style-active="transform:scale(0.94)" style-focus="outline:2px solid var(--pf-focus);outline-offset:2px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
          </button>
        </div>
      </form>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:600},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:36,&quot;max&quot;:48}}">
class Component extends DCLogic {
  // Predefined, keyword-based chat: no AI, no network. Every answer is local copy (QA below + PF_CONTENT for
  // project links, AI tools and contact details). Typed messages are normalised, checked for short social
  // phrases (greeting / thanks / goodbye), then matched to portfolio intents by word-boundary patterns;
  // several confident intents → one combined answer; nothing confident → the fallback with a mailto link.
  state = {
    open: false, draft: '', sending: false, pos: null, asked: [],
    msgs: [{ role: 'cat', paras: ["Mrrp, hi there! I'm Thư's little cat. I nap in her footer, but I'm always happy to show you around. Pick a question or ask me anything about her work!"] }]
  };
  static QA = [
    { id: 'background', q: "What's Thư's background?",
      pats: [/\bbackground\b/, /\bbackgroud\b/, /\bexperienc(e|ed)\b/, /\bexperiance\b/, /\byears?\b/, /\bcareer\b/, /\bbio\b/, /\bwho is (she|thu)\b/, /\b(tell me )?about (her|thu)( background| experience| career)?$/, /\bwho is she\b/, /\bher (history|journey)\b/, /\bwhere is she\b/, /\bbased\b/],
      paras: ["Thư is a Product Designer with 5 years of experience across AI SaaS, B2B/B2C products, eCommerce, fintech, and agritech. She focuses on turning complex product problems into intuitive, user-centered experiences."] },
    { id: 'projects', q: 'Tell me about her projects',
      pats: [/\bprojects?\b/, /\bprojets?\b/, /\bcase stud(y|ies)\b/, /\bworked on\b/, /\bher work\b/, /\bportfolio pieces\b/, /\bexamples?\b/, /\bpaykit\b/, /\benfarm\b/, /\bsssmarket\b/, /\bdoctranslate\b/, /\bbim\b/, /\blumin\b/, /\bshipped\b/],
      paras: ["Thư has worked on products across fintech, agritech, and SaaS platforms. Her work covers onboarding optimization, payment experiences, information architecture, collaboration workflows, and product UX improvements.", 'Explore her case studies to see her approach, design decisions, and contributions:'], links: 'projects' },
    { id: 'ai', q: 'How does she use AI in her workflow?',
      pats: [/\bai\b/, /\ba i\b/, /\bartificial intelligence\b/, /\bworkflows?\b/, /\bclaude\b/, /\bchat ?gpt\b/, /\bgpt\b/, /\bllms?\b/, /\bprompt(s|ing)?\b/, /\bfigma make\b/, /\bmachine learning\b/],
      paras: ['Thư uses AI to speed up research synthesis, explore alternative UI concepts and user flows, generate copy variations, and support collaboration through structured test plans and A/B test ideas.', 'AI helps her explore faster, but she validates insights against the original evidence and relies on user feedback and experiment data to make design decisions.'] },
    { id: 'strengths', q: 'What are her key strengths?',
      pats: [/\bstrengths?\b/, /\bstrenghts?\b/, /\bgood at\b/, /\bbest at\b/, /\bskills?\b/, /\bsuperpowers?\b/, /\bexpertise\b/, /\bspecialt(y|ies)\b/, /\bspeciali[sz]e\b/, /\bwhy (should|would) (we|i|you) hire\b/, /\bwhat makes her\b/],
      paras: ['Her strengths include simplifying complex user flows, structuring information architecture, improving onboarding experiences, and connecting user needs with product goals.', 'She enjoys working with PMs, BAs, and developers to turn ambiguous problems into clear, practical design solutions.'] },
    { id: 'tools', q: 'What tools does she use?',
      pats: [/\btools?\b/, /\btoolkit\b/, /\bsoftware\b/, /\bfigma\b/, /\bstack\b/, /\bprograms?\b/, /\bapps? (does she|she) use\b/, /\bdesign with\b/],
      paras: ['Her toolkit combines design and prototyping tools, AI-assisted workflows, and tools for research and collaboration. The AI tools she uses:'], tools: true },
    { id: 'contact', q: 'How can I contact Thư?',
      pats: [/\bcontact\b/, /\bcontct\b/, /\be ?mail\b/, /\bemial\b/, /\breach (her|thu|out)\b/, /\bget in touch\b/, /\blinkedin\b/, /\bphone\b/, /\bcall (her|thu)\b/, /\bconnect with\b/, /\bmessage (her|thu)\b/, /\b(can|how do|how can|want to|would like to) (i|we) hire\b/],
      paras: ['Thanks for your interest! You can reach Thư here:'], links: 'contact' }
  ];
  static SOCIAL = {
    greet: [/^(hi+|hello+|hey+|heya|hiya|yo|howdy|hallo|helo|xin chao|chao)( there| cat| kitty| thu)?$/, /^good (morning|afternoon|evening)$/],
    howru: [/\bhow are (you|u)\b/, /\bhow r u\b/, /\bhow is it going\b/, /\bwhat is up\b/, /^sup$/, /\bhow are things\b/],
    thanks: [/\b(thanks?|thank (you|u)|thx|thnx|thanx|ty|tysm|cam on|appreciate it)\b/],
    bye: [/\b(bye+|goodbye|good bye|see (you|ya)|cya|ttyl|take care|later)\b/]
  };
  static REPLY = {
    greet: ['Mrrp, hi there! ฅ^•ﻌ•^ฅ Want to know more about Thư? I can show you around!', "Hello, hello! *stretches* Ask me about Thư's projects, her AI workflow, or how to reach her."],
    howru: ['Doing pawsome, thanks for asking! Just woke up from a nap. What would you like to know about Thư?'],
    thanks: ["You're very welcome! *happy purrs* Let me know if you'd like to explore anything else."],
    bye: ["Meow-bye! Thanks for stopping by. Hope to see you around Thư's portfolio again!"]
  };
  normalize(text) {
    let t = String(text).toLowerCase().replace(/[’‘`]/g, "'").trim();
    t = t.replace(/thư/g, 'thu').replace(/\bwhat's\b/g, 'what is').replace(/\bhow's\b/g, 'how is').replace(/\bwho's\b/g, 'who is')
      .replace(/\bwhere's\b/g, 'where is').replace(/\bshe's\b/g, 'she is').replace(/\bi'm\b/g, 'i am').replace(/\byou're\b/g, 'you are')
      .replace(/\bwhats\b/g, 'what is').replace(/\bwassup|wazzup|whatsup\b/g, 'what is up').replace(/\bcan't\b/g, 'cannot').replace(/n't\b/g, ' not').replace(/'s\b/g, '');
    return t.replace(/[^a-z0-9à-ỹđ\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  intents(t) { return Component.QA.filter(qa => qa.pats.some(p => p.test(t))); }
  social(t) {
    const S = Component.SOCIAL;
    for (const k of ['thanks', 'bye', 'howru', 'greet']) if (S[k].some(p => p.test(t))) return k;
    return null;
  }
  // Returns { kind: 'qa', list } | { kind: 'social', key } | { kind: 'none' }.
  classify(text) {
    const t = this.normalize(text);
    if (!t) return { kind: 'none' };
    const hits = this.intents(t), soc = this.social(t), words = t.split(' ').length;
    if (soc && (!hits.length || words <= 4)) return { kind: 'social', key: soc };
    if (hits.length) return { kind: 'qa', list: hits.slice(0, 3) };
    if (soc) return { kind: 'social', key: soc };
    return { kind: 'none' };
  }
  data() { return window.PF_CONTENT || null; }
  endpoint() { return (window.PF_CHAT && window.PF_CHAT.endpoint) || null; }
  rootEl = null; btnEl = null; listEl = null; inputEl = null;
  rootRef = (el) => { this.rootEl = el; };
  btnRef = (el) => { this.btnEl = el; };
  listRef = (el) => { this.listEl = el; };
  inputRef = (el) => { this.inputEl = el; };

  linksFor(kind) {
    const d = this.data();
    if (!d) return [];
    if (kind === 'projects') return (d.projects || []).filter(p => !p.hidden && !p.draft).map(p => ({ label: p.short || p.name || p.title, href: '#/work/' + p.id, internal: true }));
    if (kind === 'contact') {
      const p = d.person || {}, out = [];
      if (p.email) out.push({ label: p.email, href: 'mailto:' + p.email });
      if (p.linkedin) out.push({ label: 'LinkedIn', href: p.linkedin, external: true });
      if (p.substack) out.push({ label: 'Substack', href: p.substack, external: true });
      return out;
    }
    return [];
  }
  toolList() {
    const d = this.data(), names = (d && d.person && d.person.aiWorkflow && d.person.aiWorkflow.tools) || [];
    return names.map(name => ({ name, key: /^claude/i.test(name) ? 'claude' : /^figma/i.test(name) ? 'figma' : /chatgpt|openai/i.test(name) ? 'openai' : '' }));
  }
  logoEl(key) {
    if (key === 'openai') return React.createElement('svg', { width: 14, height: 14, viewBox: '0 0 16 16', fill: 'currentColor', style: { display: 'block' } }, React.createElement('path', { d: 'M14.949 6.547a3.94 3.94 0 0 0-.348-3.273 4.11 4.11 0 0 0-4.4-1.934A4.1 4.1 0 0 0 8.423.2 4.15 4.15 0 0 0 6.305.086a4.1 4.1 0 0 0-1.891.948 4.04 4.04 0 0 0-1.158 1.753 4.1 4.1 0 0 0-1.563.679A4 4 0 0 0 .554 4.72a3.99 3.99 0 0 0 .502 4.731 3.94 3.94 0 0 0 .346 3.274 4.11 4.11 0 0 0 4.402 1.933c.382.425.852.764 1.377.995.526.231 1.095.35 1.67.346 1.78.002 3.358-1.132 3.901-2.804a4.1 4.1 0 0 0 1.563-.68 4 4 0 0 0 1.14-1.253 3.99 3.99 0 0 0-.506-4.716m-6.097 8.406a3.05 3.05 0 0 1-1.945-.694l.096-.054 3.23-1.838a.53.53 0 0 0 .265-.455v-4.49l1.366.778q.02.011.025.035v3.722c-.003 1.653-1.361 2.992-3.037 2.996m-6.53-2.75a2.95 2.95 0 0 1-.36-2.01l.095.057L5.29 12.09a.53.53 0 0 0 .527 0l3.949-2.246v1.555a.05.05 0 0 1-.022.041L6.473 13.3c-1.454.826-3.311.335-4.15-1.098m-.85-6.94A3.02 3.02 0 0 1 3.07 3.949v3.785a.51.51 0 0 0 .262.451l3.93 2.237-1.366.779a.05.05 0 0 1-.048 0L2.585 9.342a2.98 2.98 0 0 1-1.113-4.094zm11.216 2.571L8.747 5.576l1.362-.776a.05.05 0 0 1 .048 0l3.265 1.86a3 3 0 0 1 1.173 1.207 2.96 2.96 0 0 1-.27 3.2 3.05 3.05 0 0 1-1.36.997V8.279a.52.52 0 0 0-.276-.445m1.36-2.015-.097-.057-3.226-1.855a.53.53 0 0 0-.53 0L6.249 6.153V4.598a.04.04 0 0 1 .019-.04L9.533 2.7a3.07 3.07 0 0 1 3.257.139c.474.325.843.778 1.066 1.303.223.526.289 1.103.191 1.664zM5.503 8.575 4.139 7.8a.05.05 0 0 1-.026-.037V4.049c0-.57.166-1.127.476-1.607s.752-.864 1.275-1.105a3.08 3.08 0 0 1 3.234.41l-.096.054-3.23 1.838a.53.53 0 0 0-.265.455zm.742-1.577 1.758-1 1.762 1v2l-1.755 1-1.762-1z' }));
    if (!key) return null;
    const path = 'assets/images/logos/' + key + '.svg';
    return React.createElement('img', { src: window.pfAsset ? window.pfAsset(path) : path, alt: '', width: 14, height: 14, style: { display: 'block', width: 'auto', height: '14px', maxWidth: '14px', objectFit: 'contain' } });
  }
  measure = () => {
    if (!this.btnEl) return null;
    const r = this.btnEl.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    const w = Math.min(372, vw - 24);
    const rightEdge = Math.max(r.right, 12 + w);
    return { w, right: r.right - Math.min(rightEdge, vw - 12), maxH: Math.max(260, Math.min(500, vh - r.bottom - 28)) };
  };
  open = () => this.setState({ open: true, pos: this.measure() }, () => { this.toBottom(); this.focusField(); });
  close = (refocus) => {
    if (!this.state.open) return;
    this.setState({ open: false });
    if (refocus && this.btnEl) this.btnEl.focus();
  };
  onDocDown = (e) => { if (this.state.open && this.rootEl && !this.rootEl.contains(e.target)) this.close(false); };
  onDocKey = (e) => { if (this.state.open && e.key === 'Escape') { e.stopPropagation(); this.close(true); } };
  onResize = () => { if (this.state.open) this.setState({ pos: this.measure() }); };
  componentDidMount() {
    document.addEventListener('pointerdown', this.onDocDown, true);
    document.addEventListener('keydown', this.onDocKey);
    window.addEventListener('resize', this.onResize);
  }
  componentWillUnmount() {
    document.removeEventListener('pointerdown', this.onDocDown, true);
    document.removeEventListener('keydown', this.onDocKey);
    window.removeEventListener('resize', this.onResize);
    clearTimeout(this._replyT);
  }
  componentDidUpdate(_, prev) {
    if (this.state.open && !prev.open && this.inputEl) this.inputEl.focus({ preventScroll: true });
    if (this.listEl && (this.state.msgs !== prev.msgs || this.state.sending !== prev.sending || (this.state.open && !prev.open))) this.listEl.scrollTop = this.listEl.scrollHeight;
  }
  // Explicit post-render follow-ups (scroll to newest, focus the field) — run after each append / open.
  listNode() { return (this.listEl && this.listEl.isConnected) ? this.listEl : (this.rootEl && this.rootEl.querySelector('[aria-live]')); }
  toBottom = () => {
    const go = () => { const L = this.listNode(); if (L) L.scrollTop = L.scrollHeight; };
    requestAnimationFrame(() => { go(); requestAnimationFrame(go); });
  };
  focusField = () => requestAnimationFrame(() => {
    const t = (this.inputEl && this.inputEl.isConnected) ? this.inputEl : (this.rootEl && this.rootEl.querySelector('textarea'));
    if (t) t.focus({ preventScroll: true });
  });
  grow() { const t = this.inputEl; if (!t) return; t.style.height = 'auto'; t.style.height = Math.min(96, t.scrollHeight) + 'px'; }

  // Shared path for chips and typed messages: answers appear immediately (no fake typing).
  answer(list) {
    const multi = list.length > 1, paras = [], links = [], seen = new Set();
    let tools = false;
    list.forEach(qa => {
      if (multi) paras.push(qa.paras[0]); else paras.push(...qa.paras);
      if (qa.links) this.linksFor(qa.links).forEach(l => { if (!seen.has(l.href)) { seen.add(l.href); links.push(l); } });
      if (qa.tools) tools = true;
    });
    if (multi && list.some(qa => qa.links === 'projects')) paras.push('Her case studies:');
    return { role: 'cat', paras, links: links.length ? links : null, tools };
  }
  pushCat(msg, ids) {
    this.setState(s => ({ msgs: s.msgs.concat(msg), asked: (ids || []).reduce((a, id) => a.includes(id) ? a : a.concat(id), s.asked) }), this.toBottom);
  }
  ask = (qa) => {
    this.setState(s => ({ msgs: s.msgs.concat({ role: 'user', text: qa.q }) }), this.toBottom);
    this.pushCat(this.answer([qa]), [qa.id]);
  };
  send = () => {
    const text = this.state.draft.trim();
    if (!text) return;
    this.setState(s => ({ msgs: s.msgs.concat({ role: 'user', text }), draft: '' }), () => { this.grow(); this.toBottom(); });
    const c = this.classify(text);
    if (c.kind === 'qa') { this.pushCat(this.answer(c.list), c.list.map(q => q.id)); return; }
    if (c.kind === 'social') {
      const opts = Component.REPLY[c.key]; this._soc = (this._soc || 0) + 1;
      this.pushCat({ role: 'cat', paras: [opts[this._soc % opts.length]] });
      return;
    }
    const email = ((this.data() || {}).person || {}).email;
    this.pushCat(email
      ? { role: 'cat', paras: [], tail: { before: "Hmm, that's outside my little cat brain for now. 🐾 I'm better at telling you about Thư's work! Try one of the questions below, or ", link: 'email Thư directly', href: 'mailto:' + email, after: '.' } }
      : { role: 'cat', paras: ["Hmm, that's outside my little cat brain for now. 🐾 I'm better at telling you about Thư's work! Try one of the questions below."] });
  };

  renderVals() {
    const { open, draft, sending, pos, asked } = this.state;
    const cantSend = !draft.trim();
    const fresh = asked.length === 0 && !this.state.msgs.some(m => m.role === 'user');
    const unasked = Component.QA.filter(qa => !asked.includes(qa.id));
    const left = unasked.length ? unasked : Component.QA;
    return {
      px: (this.props.size || 40) + 'px',
      open, btnLabel: open ? 'Close cat chat' : 'Open cat chat',
      toggle: () => (open ? this.close(false) : this.open()),
      closeBtn: () => this.close(true),
      rootRef: this.rootRef, btnRef: this.btnRef, listRef: this.listRef, inputRef: this.inputRef,
      popW: (pos ? pos.w : 360) + 'px', popRight: (pos ? pos.right : 0) + 'px', popMaxH: (pos ? pos.maxH : 500) + 'px',
      statusText: "Your tiny guide to Thư's portfolio",
      statusDot: 'var(--pf-accent)',
      typingText: 'Typing…',
      msgs: this.state.msgs.map(m => {
        const links = (m.links || []).map(l => ({ label: l.label, href: l.href, target: l.external ? '_blank' : '_self', arrow: l.external ? '↗' : (l.internal ? '→' : ''), onClick: l.internal ? () => this.close(false) : undefined }));
        const tools = m.tools ? this.toolList().map(t => ({ name: t.name, logo: this.logoEl(t.key) })) : [];
        const tl = m.tail || null;
        return { hasTail: !!tl, tailBefore: tl ? tl.before : '', tailLink: tl ? tl.link : '', tailHref: tl ? tl.href : '', tailAfter: tl ? tl.after : '', text: m.text, paras: m.paras || [], isCat: m.role === 'cat', isUser: m.role === 'user', isNote: m.role === 'note', links, hasLinks: links.length > 0, tools, hasTools: tools.length > 0 };
      }),
      showSuggest: left.length > 0,
      suggestLabel: fresh ? 'Try asking' : 'More questions',
      suggestions: left.map(qa => ({ q: qa.q, ask: () => this.ask(qa) })),
      sending: false, draft, cantSend: cantSend ? 'true' : 'false', sendOpacity: cantSend ? 0.4 : 1,
      onInput: (e) => { this.setState({ draft: e.target.value }); this.grow(); },
      onKeyDown: (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) { e.preventDefault(); this.send(); } },
      onSubmit: (e) => { e.preventDefault(); this.send(); }
    };
  }
}
</script>
