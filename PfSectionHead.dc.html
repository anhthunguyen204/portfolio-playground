<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./theme.js"></script><link rel="stylesheet" href="assets/fonts/fonts.css"></helmet>
<header style="display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:baseline;gap:12px;font-family:var(--pf-mono);font-size:12px;font-weight:400;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-muted)">
    <span>{{ label }}</span>
  </div>
  <sc-if value="{{ hasTitle }}" hint-placeholder-val="{{ true }}">
    <h2 style="margin:0;font-family:var(--pf-sans);font-weight:700;font-size:clamp(28px,3vw,40px);line-height:1.12;letter-spacing:-0.03em;color:var(--pf-fg);max-width:24ch;text-wrap:balance">{{ title }}</h2>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:140},&quot;n&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Selected work&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Product work across fintech, agritech and commerce&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { n: this.props.n ?? '01', label: this.props.label ?? 'Section', title: this.props.title ?? '', hasTitle: !!this.props.title };
  }
}
</script>
</body>
</html>
