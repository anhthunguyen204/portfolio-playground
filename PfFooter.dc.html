<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./theme.js"></script><link rel="stylesheet" href="assets/fonts/fonts.css"></helmet>
<footer ref="{{ footRef }}" style="background:var(--pf-bg);padding:0 clamp(12px,2.4vw,24px) clamp(12px,2.4vw,24px)">
  <div id="contact" aria-labelledby="contact-title" style="position:relative;background:var(--pf-footer-card);color:var(--pf-fg);font-family:var(--pf-sans);border-radius:clamp(18px,2.4vw,28px);padding:clamp(36px,6vw,80px) clamp(20px,4vw,48px) clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:clamp(40px,6vw,72px);scroll-margin-top:84px">
    <div aria-hidden="true" style="position:absolute;inset:0;z-index:0;border-radius:inherit;overflow:hidden;pointer-events:none">
      <img src="{{ meadowSrc }}" alt="" decoding="async" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 82%;opacity:var(--pf-footer-art-opacity);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 45%);mask-image:linear-gradient(to bottom,transparent 0%,#000 45%)">
    </div>
    <div aria-hidden="false" style="position:absolute;top:0;right:clamp(28px,9vw,140px);width:clamp(100px,13vw,168px);aspect-ratio:520/342;transform:translateY(-86.3%);z-index:2;pointer-events:none">
      <img ref="{{ catRef }}" src="{{ catSrc }}" alt="Cute cartoon cat holding onto the footer" width="520" height="342" decoding="async" style="display:block;width:100%;height:auto;will-change:transform">
    </div>
    <div style="position:relative;z-index:1;max-width:1200px;width:100%;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px 64px;align-items:end">
      <div style="display:flex;flex-direction:column;gap:24px;min-width:0">
        <div style="display:flex;align-items:center;gap:10px;font-family:var(--pf-mono);font-size:12px;font-weight:400;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-muted)"><span style="width:8px;height:8px;border-radius:50%;background:var(--pf-accent)"></span><span>Contact</span></div>
        <h2 id="contact-title" style="margin:0;font-weight:700;font-size:clamp(32px,4.6vw,60px);line-height:1.04;letter-spacing:-0.04em;max-width:14ch;text-wrap:balance">Would love to connect with you!</h2>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px">
          <a href="mailto:{{ person.email }}" style="display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;border-radius:14px;background:var(--pf-fg);color:var(--pf-bg);font-size:15px;font-weight:500;text-decoration:none;max-width:100%;overflow-wrap:anywhere;transition:background-color 160ms,transform 140ms" style-hover="background:var(--pf-fg-hover);color:var(--pf-bg)" style-active="transform:scale(0.98)" style-focus="outline:2px solid var(--pf-focus);outline-offset:3px">{{ person.email }}</a>
        </div>
      </div>
      <dl style="margin:0;display:flex;flex-direction:column;gap:18px;min-width:0">
        <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;font-size:15px;align-items:baseline">
          <dt style="font-family:var(--pf-mono);font-size:12px;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-subtle)">LinkedIn</dt>
          <dd style="margin:0;overflow-wrap:anywhere"><a href="{{ person.linkedin }}" target="_blank" rel="noopener" style="color:var(--pf-fg);text-decoration:none" style-hover="color:var(--pf-accent)" style-focus="outline:2px solid var(--pf-focus);outline-offset:4px">{{ person.linkedinLabel }} ↗</a></dd>
        </div>
        <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;font-size:15px;align-items:baseline">
          <dt style="font-family:var(--pf-mono);font-size:12px;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-subtle)">Phone</dt>
          <dd style="margin:0"><a href="tel:{{ phoneHref }}" style="color:var(--pf-fg);text-decoration:none" style-hover="color:var(--pf-accent)" style-focus="outline:2px solid var(--pf-focus);outline-offset:4px">{{ person.phone }}</a></dd>
        </div>
        <div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;font-size:15px;align-items:baseline">
          <dt style="font-family:var(--pf-mono);font-size:12px;letter-spacing:0.02em;text-transform:uppercase;color:var(--pf-subtle)">Based in</dt>
          <dd style="margin:0">{{ person.location }}</dd>
        </div>
      </dl>
    </div>
    <div style="position:relative;z-index:1;max-width:1200px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 32px;font-family:var(--pf-sans);font-size:13px;color:var(--pf-muted)">
      <span style="text-wrap:pretty">© {{ year }} Thư Nguyễn · Product Designer (UX/UI)</span>
      <div style="display:flex;flex-wrap:wrap;gap:24px">
        <a href="https://www.linkedin.com/in/ngnanhthu204/" target="_blank" rel="noopener" style="color:var(--pf-fg);text-decoration:none" style-hover="color:var(--pf-accent)" style-focus="outline:2px solid var(--pf-focus);outline-offset:4px">LinkedIn ↗</a>
        <a href="https://substack.com/@ngnanhthu204" target="_blank" rel="noopener" style="color:var(--pf-fg);text-decoration:none" style-hover="color:var(--pf-accent)" style-focus="outline:2px solid var(--pf-focus);outline-offset:4px">Substack ↗</a>
      </div>
    </div>
  </div>
</footer>
<button type="button" ref="{{ topRef }}" onClick="{{ toTop }}" aria-label="Back to top" title="Back to top" tabindex="-1" style="position:fixed;right:clamp(16px,2.4vw,24px);bottom:clamp(16px,2.4vw,24px);z-index:40;width:48px;height:48px;border-radius:999px;border:none;padding:0;display:flex;align-items:center;justify-content:center;background:var(--pf-accent);color:var(--pf-on-accent);font-family:var(--pf-sans);font-size:20px;font-weight:600;line-height:1;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity 220ms ease,transform 220ms cubic-bezier(.22,1,.36,1),visibility 0s linear 220ms,background-color 160ms ease" style-hover="background:var(--pf-accent-hover)" style-active="transform:scale(0.94);background:var(--pf-accent-active)" style-focus="outline:2px solid var(--pf-focus);outline-offset:3px">↑</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:460},&quot;person&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  // Floating back-to-top: shown past a scroll threshold. Visibility is toggled on the DOM node from one
  // rAF-throttled passive listener, so scrolling never re-renders the component.
  topEl = null;
  shown = false;
  topRef = (el) => { this.topEl = el; if (el) this.sync(); };
  footEl = null;
  footRef = (el) => { this.footEl = el; };
  sync = () => {
    this._raf = 0;
    const el = this.topEl;
    if (!el) return;
    // Once the footer card scrolls into view, lift the button so it sits 12px above the card instead of over its links.
    const base = Math.min(24, Math.max(16, window.innerWidth * 0.024));
    const fTop = this.footEl ? this.footEl.getBoundingClientRect().top : Infinity;
    const lift = Math.max(0, (window.innerHeight - base) - (fTop - 12));
    el.style.bottom = (base + lift) + 'px';
    const show = window.scrollY > Math.max(480, window.innerHeight * 0.6);
    if (show === this.shown) return;
    this.shown = show;
    el.style.opacity = show ? '1' : '0';
    el.style.visibility = show ? 'visible' : 'hidden';
    el.style.transform = show ? 'translateY(0)' : 'translateY(10px)';
    el.style.transition = show
      ? 'opacity 220ms ease, transform 220ms cubic-bezier(.22,1,.36,1), visibility 0s, background-color 160ms ease'
      : 'opacity 220ms ease, transform 220ms cubic-bezier(.22,1,.36,1), visibility 0s linear 220ms, background-color 160ms ease';
    el.tabIndex = show ? 0 : -1;
  };
  onScroll = () => { if (!this._raf) this._raf = requestAnimationFrame(this.sync); };
  // Peeking cat: a slow 3px bob, skipped under reduced motion.
  catRef = (el) => {
    if (this._catAnim) { this._catAnim.cancel(); this._catAnim = null; }
    if (!el || !el.animate) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this._catAnim = el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-3px)' }, { transform: 'translateY(0)' }], { duration: 4200, iterations: Infinity, easing: 'ease-in-out' });
  };
  componentDidMount() { window.addEventListener('scroll', this.onScroll, { passive: true }); window.addEventListener('resize', this.onScroll); this.sync(); }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onScroll); if (this._raf) cancelAnimationFrame(this._raf); if (this._catAnim) this._catAnim.cancel(); }
  renderVals() {
    const person = this.props.person || { email: 'ngnanhthu@gmail.com', linkedin: 'https://www.linkedin.com/in/ngnanhthu204/', linkedinLabel: 'linkedin.com/in/ngnanhthu204', phone: '+84 705 441 776', location: 'Ho Chi Minh City, Viet Nam' };
    return {
      person, phoneHref: (person.phone || '').replace(/\s/g, ''),
      catRef: this.catRef,
      meadowSrc: window.pfAsset ? window.pfAsset('assets/images/site/footer-meadow.jpg') : 'assets/images/site/footer-meadow.jpg',
      catSrc: window.pfAsset ? window.pfAsset('assets/images/site/footer-cat.png') : 'assets/images/site/footer-cat.png',
      year: new Date().getFullYear(),
      topRef: this.topRef,
      toTop: () => {
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
        if (this.topEl) this.topEl.blur();
      }
    };
  }
}
</script>
</body>
</html>
